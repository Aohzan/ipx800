name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked

      # With the package constraints of the oldest supported Home Assistant
      - name: Check requirements against Home Assistant constraints
        run: python3 scripts/sync_requirements.py --check

      - name: Run regression tests
        run: uv run --locked python -m unittest discover -s tests -v
