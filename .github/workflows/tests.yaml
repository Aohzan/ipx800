name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked

      # Home Assistant installs the manifest requirements with its package
      # constraints (here of the oldest supported version, locked in uv.lock):
      # a library must not need a newer version of a package pinned by the core.
      - name: Check requirements against Home Assistant constraints
        run: |
          constraints="$(uv run --locked python -c 'import homeassistant, pathlib; print(pathlib.Path(homeassistant.__file__).with_name("package_constraints.txt"))')"
          uv run --locked python scripts/sync_requirements.py --print \
            | xargs -r uv pip install --dry-run --constraint "$constraints"

      - name: Run regression tests
        run: uv run --locked python -m unittest discover -s tests -v
